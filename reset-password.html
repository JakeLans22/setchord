<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose a new password · Latreia</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page" data-page="reset-password" data-protected="true">
  <main class="auth-card">
    <a class="brand brand-centered" href="index.html"><span class="brand-mark">[L]</span><span>atreia</span></a>
    <p class="eyebrow">ACCOUNT RECOVERY</p><h1>Choose a new password</h1><p class="muted">Use at least 8 characters for your new password.</p>
    <div class="notice" id="pageMessage" role="status" hidden></div>
    <form id="resetPasswordForm" class="stack-form">
      <label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
      <label>Confirm new password<input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label>
      <button class="button button-primary button-full" type="submit">Update password</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/app.js"></script>
</body>
</html>
