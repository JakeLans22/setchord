<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SetChord - Song</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <div class="app">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="logo">
                SetChord
            </div>


            <nav class="navigation">

                <a
                    href="index.html"
                    class="nav-link"
                >
                    Dashboard
                </a>


                <a
                    href="songs.html"
                    class="nav-link active"
                >
                    Songs
                </a>


                <a
                    href="#"
                    class="nav-link"
                >
                    Setlists
                </a>


                <a
                    href="#"
                    class="nav-link"
                >
                    Settings
                </a>

            </nav>

        </aside>


        <!-- MAIN CONTENT -->

        <main class="main-content">


            <!-- BACK BUTTON -->

            <div style="margin-bottom: 25px;">

                <a
                    href="songs.html"
                    style="color: #71717a;"
                >
                    ← Back to Songs
                </a>

            </div>


            <!-- SONG HEADER -->

            <section
                class="welcome-section"
                id="songHeader"
            >

                <h1 id="viewerTitle">
                    Song Title
                </h1>


                <p id="viewerArtist">
                    Artist
                </p>

            </section>


            <!-- KEY CONTROLS -->

            <section
                class="recent-section"
                style="margin-bottom: 25px;"
            >

                <div
                    style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                    "
                >

                    <div>

                        <span
                            style="
                                color: #71717a;
                                font-size: 14px;
                            "
                        >
                            Current Key
                        </span>


                        <h2 id="currentKey">
                            C
                        </h2>

                    </div>


                    <div
                        style="
                            display: flex;
                            gap: 10px;
                        "
                    >

                        <button
                            id="decreaseKey"
                            class="cancel-button"
                        >
                            −
                        </button>


                        <button
                            id="increaseKey"
                            class="save-button"
                        >
                            +
                        </button>

                    </div>

                </div>

            </section>


            <!-- SONG CHART -->

            <section
                class="recent-section"
            >

                <pre
                    id="songChartViewer"
                    style="
                        white-space: pre-wrap;
                        font-family: inherit;
                        font-size: 18px;
                        line-height: 2;
                    "
                ></pre>

            </section>

        </main>

    </div>


    <!-- MAIN JAVASCRIPT -->

    <script src="js/app.js"></script>

</body>

</html>
