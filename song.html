<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12"><title>Song · Latreia</title><link rel="stylesheet" href="css/style.css">
</head>
<body data-page="song" data-protected="true">
  <div class="app-shell song-app-shell" id="songAppShell">
    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Open sidebar" aria-expanded="false" aria-controls="songSidebar">&#9776;</button>
    <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Close sidebar" hidden></button>
    <aside class="sidebar" id="songSidebar" aria-hidden="true" inert>
      <a class="brand" href="index.html"><span class="brand-mark">[<span class="brand-initial">L</span>]</span><span>atreia</span></a>
      <nav class="navigation" aria-label="Main navigation"><a class="nav-link" href="index.html">Dashboard</a><a class="nav-link active" href="songs.html">Songs</a><a class="nav-link" href="sets.html">Worship sets</a><a class="nav-link" href="add-song.html">Add a song</a></nav>
      <div class="sidebar-user"><span class="avatar" id="userAvatar" aria-hidden="true">L</span><span class="user-name" id="userDisplayName">Your account</span><button class="text-button" id="logoutButton" type="button">Sign out</button></div>
    </aside>
    <main class="main-content performance-page">
      <a class="back-link" href="songs.html">← Back to songs</a>
      <div class="notice" id="pageMessage" role="status" hidden></div>
      <header class="performance-header"><div><p class="eyebrow">PERFORMANCE MODE</p><h1 id="songTitle">Loading song…</h1><p class="muted" id="songArtist"></p></div><a class="button button-secondary" id="editSongLink" href="songs.html">Edit song</a></header>
      <nav class="set-song-navigation" id="setSongNavigation" aria-label="Navigate songs in this set" hidden>
        <a class="button button-secondary button-small" id="setSongBack" href="sets.html">← Back to set</a>
        <span class="set-song-position" id="setSongPosition"></span>
        <div class="set-song-navigation-actions">
          <a class="button button-secondary button-small" id="previousSetSong" href="song.html">← Previous</a>
          <a class="button button-primary button-small" id="nextSetSong" href="song.html">Next song →</a>
        </div>
      </nav>
      <section class="key-panel" aria-label="Transpose song">
        <div><span class="stat-label">Original key</span><strong id="originalKey" class="original-key">—</strong></div>
        <div class="transpose-control"><button class="transpose-button" id="transposeDown" type="button" aria-label="Transpose down one semitone">−</button><div class="current-key"><span class="stat-label">Current key</span><strong id="currentKey">—</strong></div><button class="transpose-button" id="transposeUp" type="button" aria-label="Transpose up one semitone">+</button></div>
        <button class="button button-secondary" id="resetKey" type="button">Reset key</button>
      </section>
      <nav class="song-section-navigation" id="songSectionNavigation" aria-label="Navigate song sections" hidden>
        <div class="song-section-navigation-heading">
          <span class="song-section-navigation-title">Song sections</span>
          <div class="song-section-navigation-actions">
            <a class="button button-primary button-small" id="nextSetSongFromChart" href="song.html" hidden>Next song →</a>
            <button class="song-section-toggle" id="songSectionToggle" type="button" aria-expanded="true" aria-controls="songSectionLinks">Hide sections</button>
          </div>
        </div>
        <div class="song-section-links" id="songSectionLinks"></div>
      </nav>
      <section class="chart-card"><div id="songChart" class="rendered-chart" aria-live="polite"><p class="empty-state">Loading chart…</p></div></section>
      <p class="source-link" id="songSource"></p>
      <nav class="set-song-bottom-navigation" id="setSongBottomNavigation" aria-label="Continue to the next song in this set" hidden>
        <a class="button button-primary" id="nextSetSongBottom" href="song.html">Next song →</a>
      </nav>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/app.js"></script>
</body>
</html>
