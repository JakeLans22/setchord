<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Songs · SetChord</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="songs" data-protected="true">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html"><span class="brand-mark">S</span><span>SetChord</span></a>
      <nav class="navigation" aria-label="Main navigation">
        <a class="nav-link" href="index.html">Dashboard</a><a class="nav-link active" href="songs.html" aria-current="page">Songs</a>
        <a class="nav-link" href="sets.html">Worship sets</a><a class="nav-link" href="add-song.html">Add a song</a>
      </nav>
      <div class="sidebar-user"><span class="avatar" id="userAvatar" aria-hidden="true">S</span><span class="user-name" id="userDisplayName">Your account</span><button class="text-button" id="logoutButton" type="button">Sign out</button></div>
    </aside>
    <main class="main-content">
      <header class="page-header"><div><p class="eyebrow">YOUR LIBRARY</p><h1>My songs</h1><p class="muted">Your personal song charts, all in one place.</p></div><a class="button button-primary" href="add-song.html">＋ Add song</a></header>
      <div class="notice" id="pageMessage" role="status" hidden></div>
      <section class="toolbar">
        <label class="search-field"><span class="sr-only">Search songs</span><span aria-hidden="true">⌕</span><input id="songSearch" type="search" placeholder="Search titles or artists…" autocomplete="off"></label>
        <label class="language-filter">Language
          <select id="songLanguageFilter" aria-label="Filter songs by language">
            <option value="">All</option><option value="Tagalog">Tagalog</option><option value="English">English</option>
          </select>
        </label>
        <span class="muted" id="songResultCount" aria-live="polite"></span>
      </section>
      <section class="song-grid" id="songList" aria-live="polite"><p class="empty-state">Loading songs…</p></section>
      <nav class="pagination" id="songPagination" aria-label="Song list pages" hidden></nav>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/app.js"></script>
</body>
</html>
