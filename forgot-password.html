<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password · SetChord</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page" data-page="forgot-password">
  <main class="auth-card">
    <a class="brand brand-centered" href="index.html"><span class="brand-mark">S</span><span>SetChord</span></a>
    <p class="eyebrow">ACCOUNT RECOVERY</p><h1>Forgot your password?</h1><p class="muted">Enter your account email and we’ll send you a link to choose a new password.</p>
    <div class="notice" id="pageMessage" role="status" hidden></div>
    <form id="forgotPasswordForm" class="stack-form">
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <button class="button button-primary button-full" type="submit">Send reset link</button>
    </form>
    <p class="auth-switch"><a href="login.html">Back to sign in</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/app.js"></script>
</body>
</html>
